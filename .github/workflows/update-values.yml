name: Обновление цен MM2

on:
  schedule:
    - cron: "*/15 * * * *"   # раз в 15 минут (GitHub иногда запускает с опозданием)
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: update-values
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Читаю новые сообщения Discord
        id: poll
        working-directory: mm2-values
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python poll.py

      - name: Сохраняю values.json
        run: |
          if git diff --quiet -- mm2-values/values.json; then
            echo "ничего нового"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add mm2-values/values.json
          git commit -m "Цены: ${{ steps.poll.outputs.changes }} изм. (Actions)"
          git push
